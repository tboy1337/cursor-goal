[mypy]
# Strict typing for the cursor-goal package (Python >= 3.12).
python_version = 3.12
strict = true
mypy_path = src
packages = cursor_goal

# Explicit strict flags (also implied by strict=true) for clarity and audits.
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
no_implicit_reexport = true
check_untyped_defs = true
strict_equality = true
extra_checks = true

# Readable CLI output.
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true

# Third-party packages without usable stubs: add selective overrides below, e.g.
#   [mypy-some_untyped_lib.*]
#   ignore_missing_imports = true
#
# When typechecking tests (mypy tests), relax decorator rules for pytest plugins:
#   [mypy-tests.*]
#   disallow_untyped_decorators = false
