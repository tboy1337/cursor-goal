[pytest]
# Core discovery
minversion = 7.0
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeouts (pytest-timeout) — every test must complete.
timeout = 30
timeout_method = thread

# Async (pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Parallelism (pytest-xdist)
# Override locally with `-n0` when debugging a single failure.
addopts =
    -ra
    -q
    --tb=short
    --strict-markers
    --strict-config
    -n auto
    --cov=cursor_goal
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=json:coverage.json
    --cov-fail-under=95

# Markers
markers =
    slow: longer-running tests (deselect with -m "not slow")
    unit: fast unit tests
    integration: cross-component / filesystem integration tests

# Treat warnings as failures so regressions surface early.
filterwarnings =
    error
    ignore::PendingDeprecationWarning
    ignore:Benchmarks are automatically disabled because xdist plugin is active:pytest_benchmark.logger.PytestBenchmarkWarning
    ignore:Module .* was previously imported:coverage.exceptions.CoverageWarning
