[pytest]
# Core discovery
minversion = 7.0
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeouts (pytest-timeout) — every test must complete.
timeout = 30
timeout_method = thread

# Parallelism (pytest-xdist)
# Override locally with `-n0` when debugging a single failure.
addopts =
    -ra
    -q
    --tb=short
    --strict-config
    -n auto
    --cov=cursor_goal
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=json:coverage.json
    --cov-fail-under=95

# Treat warnings as failures so regressions surface early.
filterwarnings =
    error
    ignore::PendingDeprecationWarning
    ignore:Module .* was previously imported:coverage.exceptions.CoverageWarning
