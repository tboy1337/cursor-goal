name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  unix-gate:
    name: Unix verify and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          pip install -e ".[dev]"
          pip install build

      - name: Version sync
        run: python scripts/check_version_sync.py

      - name: Sync plugin tree
        run: python scripts/sync-plugin-tree.py --check

      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(python -c 'from cursor_goal import __version__; print(__version__)')"
          expect="v${PKG}"
          if [ "$TAG" != "$expect" ]; then
            echo "Tag $TAG does not match package version $expect" >&2
            exit 1
          fi
          echo "Tag OK: $TAG"

      - name: Format (isort/black/pyproject-fmt)
        run: |
          isort --check-only --diff src tests scripts
          black --check --diff src tests scripts
          pyproject-fmt --check pyproject.toml

      - name: pip-audit
        run: pip-audit -r scripts/pip-audit-requirements.txt --progress-spinner off

      - name: Bandit
        run: bandit -r src/cursor_goal -c pyproject.toml -q

      - name: Pytest
        run: pytest tests -q --tb=short

      - name: Coverage metrics (>=95% statement/branch/function/combined)
        run: python scripts/check_coverage_metrics.py --threshold 95

      - name: Wake smoke
        shell: bash
        run: python scripts/wake-smoke.py

      - name: Mypy
        run: mypy src/cursor_goal

      - name: Pylint
        run: pylint src/cursor_goal

      - name: Complexipy
        run: complexipy src/cursor_goal -mx 15 --quiet

      - name: ShellCheck
        run: |
          shellcheck --severity=warning scripts/*.sh
          if [ -f .cursor/skills/cursor-goal/scripts/wake_loop.sh ]; then
            shellcheck --severity=warning .cursor/skills/cursor-goal/scripts/wake_loop.sh
          fi
          if [ -f plugins/cursor-goal/skills/cursor-goal/scripts/wake_loop.sh ]; then
            shellcheck --severity=warning plugins/cursor-goal/skills/cursor-goal/scripts/wake_loop.sh
          fi

      - name: Unix install smoke
        run: bash scripts/install-smoke.sh

      - name: Build sdist and wheel
        run: python -m build

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*

  windows-gate:
    name: Windows smoke and Pester
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Version and plugin sync
        run: |
          python scripts/check_version_sync.py
          python scripts/sync-plugin-tree.py --check

      - name: pip-audit
        run: pip-audit -r scripts/pip-audit-requirements.txt --progress-spinner off

      - name: Bandit
        run: bandit -r src/cursor_goal -c pyproject.toml -q

      - name: Pytest
        run: pytest tests -q --tb=short

      - name: Coverage metrics (>=95% statement/branch/function/combined)
        run: python scripts/check_coverage_metrics.py --threshold 95

      - name: Wake smoke
        shell: bash
        run: python scripts/wake-smoke.py

      - name: Install PSScriptAnalyzer and Pester 5
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: PowerShell tests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-powershell-tests.ps1

      - name: Windows install smoke
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-smoke.ps1

  macos-gate:
    name: macOS install smoke
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Version and plugin sync
        run: |
          python scripts/check_version_sync.py
          python scripts/sync-plugin-tree.py --check

      - name: pip-audit
        run: pip-audit -r scripts/pip-audit-requirements.txt --progress-spinner off

      - name: Bandit
        run: bandit -r src/cursor_goal -c pyproject.toml -q

      - name: Pytest
        run: pytest tests -q --tb=short

      - name: Coverage metrics (>=95% statement/branch/function/combined)
        run: python scripts/check_coverage_metrics.py --threshold 95

      - name: Wake smoke
        shell: bash
        run: python scripts/wake-smoke.py

      - name: macOS install smoke
        run: bash scripts/install-smoke.sh

  publish:
    name: Create GitHub Release
    needs: [unix-gate, windows-gate, macos-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skip"
            exit 0
          fi
          NOTES="$(printf '%s\n' \
            "## cursor-goal ${TAG}" \
            "" \
            "### Install for Cursor (required)" \
            "1. Download the **source** archive or clone \`--branch ${TAG}\`" \
            "2. Run \`./scripts/install-goal.sh\` or \`scripts/install-goal.ps1\`" \
            "3. Or import this **git repository / tag** in Cursor Dashboard → Plugins (Teams marketplace) — there is no separate plugin zip artifact" \
            "" \
            "The attached \`.whl\` / sdist are for **development** (\`pip install\`) only — they do **not** register the Cursor skill, agents, or stop hook." \
            "" \
            "See [docs/install.md](https://github.com/tboy1337/cursor-goal/blob/${TAG}/docs/install.md)." \
          )"
          gh release create "$TAG" \
            --title "cursor-goal ${TAG}" \
            --notes "$NOTES" \
            dist/*
