[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68" ]

[project]
name = "cursor-goal"
version = "2.0.0"
description = "Autonomous /goal loop harness for Cursor IDE (multi-model maker≠checker)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = [ "COPYING" ]
authors = [ { name = "tboy1337" } ]
requires-python = ">=3.12"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []
optional-dependencies.dev = [
  "autopep8",
  "bandit",
  "black",
  "isort",
  "mypy",
  "pip-audit",
  "pylint",
  "pyproject-fmt",
  "pytest",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-mock",
  "pytest-timeout",
  "pytest-xdist",
  "shellcheck-py",
]
urls.Documentation = "https://github.com/tboy1337/cursor-goal/tree/main/docs"
urls.Homepage = "https://github.com/tboy1337/cursor-goal"
urls.Repository = "https://github.com/tboy1337/cursor-goal"
scripts.cursor-goal = "cursor_goal.cli:main"

[tool.setuptools]
packages.find.where = [ "src" ]

[tool.black]
target-version = [ "py312" ]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  testing/scripts
  | testing/samples
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [ "cursor_goal" ]
src_paths = [ "src", "tests" ]
skip_glob = [ "testing/samples/**", "testing/scripts/**" ]

[tool.bandit]
exclude_dirs = [ "testing", "tests" ]
skips = [ "B404" ]
